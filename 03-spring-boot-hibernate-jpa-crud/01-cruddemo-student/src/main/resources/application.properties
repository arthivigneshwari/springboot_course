spring.application.name=cruddemo

spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#Turn off the spring Boot banner
spring.main.banner-mode=off

#Reduce logging level. Set logging level to warn
logging.level.root=warn

#Add logging configs to display SQL statements
#Log SQL statements
logging.level.org.hibernate.SQL=debug

#Log values for SQL statements
logging.level.org.hibernate.orm.jdbc.bind=trace

#Configure JPA/Hibernate to auto create the tables.
#create will drop the table and create the table for entity classes from the scratch
#Table created automatically. JPA/Hibernate did this for us in the background
#spring.jpa.hibernate.ddl-auto=create

#the "update" config will keep existing data in the table
#"update" wont drop the existing table. It will just keep adding more data to the existing table.
spring.jpa.hibernate.ddl-auto=update